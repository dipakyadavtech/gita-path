<script>
  (function() {
    let timeLeft = 42;
    const timerEl = document.getElementById('countdown-timer');
    const resendBtn = document.getElementById('resend-sms-btn');
    
    if (timerEl && resendBtn) {
      const interval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(interval);
          timerEl.textContent = '00:00';
          resendBtn.disabled = false;
          resendBtn.classList.remove('text-outline-variant', 'cursor-not-allowed');
          resendBtn.classList.add('text-primary', 'font-medium', 'hover:underline', 'cursor-pointer');
        } else {
          const formatted = timeLeft < 10 ? '0' + timeLeft : timeLeft;
          timerEl.textContent = '00:' + formatted;
        }
      }, 1000);
    }
  })();
