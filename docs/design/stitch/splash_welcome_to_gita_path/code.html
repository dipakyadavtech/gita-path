<script>
  (function initSplashScreenDelight() {
    const emblem = document.getElementById('emblem-container');
    const wheel = document.getElementById('sacred-wheel');
    const ctaStart = document.getElementById('cta-start');

    if (emblem && wheel) {
      // Micro-spin delight on tactile interaction
      let angle = 0;
      emblem.addEventListener('click', () => {
        angle += 45;
        wheel.style.transform = `rotate(${angle}deg)`;
      });
    }

    if (ctaStart) {
      ctaStart.addEventListener('click', function(e) {
        // Haptic feedback if supported
        if (navigator.vibrate) {
          navigator.vibrate(12);
        }
      });
    }
  })();
